<!DOCTYPE html>
<html>
<head>
  <title>Contact</title>

  <!-- Salesforce SDK (UNCHANGED) -->
  <script src="https://cdn.c360a.salesforce.com/beacon/c360a/b6017cc2-5283-4e07-a2d0-5df228a8fb3f/scripts/c360a.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
  <div class="logo">⚡ DemoBrand</div>
  <div>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

<section class="page-header">
  <h1>Contact Us</h1>
  <p>Register your details to experience personalised marketing journeys.</p>
</section>

<section class="form-section">
  <form id="contact-form" class="form-card">
    <label>First Name:</label>
    <input type="text" id="firstName" required>

    <label>Last Name:</label>
    <input type="text" id="lastName" required>

    <label>Email:</label>
    <input type="email" id="email" required>

    <button type="submit" class="btn-primary">Submit</button>
  </form>
</section>

<!-- ✅ DO NOT TOUCH BELOW -->
<script>
document.getElementById("contact-form").addEventListener("submit", function(event) {
 event.preventDefault();

 const email = document.getElementById("email").value;
 const firstName = document.getElementById("firstName").value;
 const lastName = document.getElementById("lastName").value;

 window.userData = {
 email,
 firstName,
 lastName
 };

 SalesforceInteractions.sendEvent({
 interaction: {
 name: "IdentityCapture"
 },
 user: {
 identities: {
 email: email
 },
 attributes: {
 eventType: "identity",
 firstName: firstName,
 lastName: lastName,
 email: email,
 isAnonymous: 0
 }
 }
 });

 console.log("✅ Identity event sent");
});
</script>

</body>
</html>
