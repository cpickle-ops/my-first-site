<!DOCTYPE html>
<html>
<head>
  <title>Contact</title>

  <!-- ✅ Salesforce Data Cloud Web SDK -->
  <script src="https://cdn.c360a.salesforce.com/beacon/c360a/6663e05d-c49f-4650-a43e-98b1e49598b1/scripts/c360a.min.js"></script>

</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="services.html">Services</a>
  <a href="contact.html">Contact</a>
</nav>

<h1>Contact Us</h1>

<form id="contact-form">

  <label for="firstName">First Name:</label><br>
  <input type="text" id="firstName" name="firstName"><br><br>

  <label for="lastName">Last Name:</label><br>
  <input type="text" id="lastName" name="lastName"><br><br>

  <label for="email">Email:</label><br>
  <input type="email" id="email" name="email"><br><br>

  <button type="submit">Send</button>

</form>

<script>
document.getElementById("contact-form").addEventListener("submit", function(event) {
  event.preventDefault();

  const email = document.getElementById("email").value;
  const firstName = document.getElementById("firstName").value;
  const lastName = document.getElementById("lastName").value;

  // ✅ Debug output
  console.group("🧠 IDENTITY EVENT DEBUG");
  console.log("Email:", email);
  console.log("First Name:", firstName);
  console.log("Last Name:", lastName);
  console.groupEnd();

  // ✅ Send identity event
  SalesforceInteractions.sendEvent({

    interaction: {
      name: "cccwebsite"
    },

    category: "identity",
    eventType: "form_submit",
    interactionName: "contact_form_submit",

    // ✅ REQUIRED → Contact Point Email mapping
    email: email,

    // ✅ CRITICAL FIX → attach consent directly to THIS event
    consents: [{
      status: SalesforceInteractions.ConsentStatus.OptIn,
      purpose: SalesforceInteractions.ConsentPurpose.Tracking,
      provider: "CCC"
    }],

    user: {
      identities: {
        email: email
      },
      attributes: {
        firstName: firstName,
        lastName: lastName,
        eventType: "identity_update"
      }
    }

  });

  console.log("✅ Identity event sent with consent + email + profile data");

});
</script>

</body>
</html>
