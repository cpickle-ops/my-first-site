<!DOCTYPE html>
<html>
<head>
  <title>Contact</title>

  <!-- Data Cloud SDK -->
  <script src="https://cdn.c360a.salesforce.com/beacon/c360a/6663e05d-c49f-4650-a43e-98b1e49598b1/scripts/c360a.min.js"></script>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="services.html">Services</a>
  <a href="contact.html">Contact</a>
</nav>

<h1>Contact Us</h1>

<form id="contact-form">

  <label>First Name:</label><br>
  <input type="text" id="firstName"><br><br>

  <label>Last Name:</label><br>
  <input type="text" id="lastName"><br><br>

  <label>Email:</label><br>
  <input type="email" id="email"><br><br>

  <button type="submit">Send</button>

</form>

<script>
document.getElementById("contact-form").addEventListener("submit", function(event) {

  event.preventDefault();

  const email = document.getElementById("email").value;
  const firstName = document.getElementById("firstName").value;
  const lastName = document.getElementById("lastName").value;

  console.group("🧠 FORM DATA");
  console.log(email, firstName, lastName);
  console.groupEnd();

SalesforceInteractions.sendEvent({

  interaction: {
    name: "cccwebsite"
  },

  category: "identity",

  // ✅ THIS is the correct value for your schema
  eventType: "identity_update",

  interactionName: "contact_form_submit",

  email: email,

  consents: [{
    provider: "CCC",
    purpose: SalesforceInteractions.ConsentPurpose.Tracking,
    status: SalesforceInteractions.ConsentStatus.OptIn
  }],

  // ✅ Top-level fields (critical)
  firstName: firstName,
  lastName: lastName,
  isAnonymous: 0,

  user: {
    identities: {
      email: email
    }
  }

});

  console.log("✅ Identity event sent");

});
</script>

</body>
</html>
